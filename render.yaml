services:
  - type: web
    name: gramcare-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: singapore
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: FIREBASE_PROJECT_ID
        value: gramcare-ai-5fffb
      - key: ALLOWED_ORIGINS
        value: https://gramcare-frontend.onrender.com,https://gramcare-ai-5fffb.web.app,https://gramcare-ai-5fffb.firebaseapp.com
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: static
    name: gramcare-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gramcare-api.onrender.com
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: gramcare-ai-5fffb.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: gramcare-ai-5fffb
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: gramcare-ai-5fffb.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "164999261973"
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
